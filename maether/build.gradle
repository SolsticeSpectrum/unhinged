plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
	maven { url = 'https://maven.nucleoid.xyz' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	implementation "eu.pb4:polymer-core:${project.polymer_version}"
	implementation "eu.pb4:polymer-blocks:${project.polymer_version}"
	implementation "eu.pb4:polymer-resource-pack:${project.polymer_version}"
	implementation "eu.pb4:polymer-virtual-entity:${project.polymer_version}"
	implementation "eu.pb4:polymer-autohost:${project.polymer_version}"
	implementation include('eu.pb4:sgui:2.2.0+26.3')
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java { withSourcesJar() }

jar {
	from("LICENSE") { rename { "${it}_maether" } }
}
